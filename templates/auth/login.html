{% extends 'base.html' %}

{% block title %}Sign In — AUTO PDI Platform{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="pdi-card p-4 p-sm-5 shadow-lg">
                <div class="text-center mb-4">
                    <div class="logo-icon mx-auto mb-2" style="width: 44px; height: 44px;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your AUTO PDI account</p>
                </div>

                <!-- Quick Demo 1-Click Auto Fill Buttons -->
                <div class="mb-4 p-3 bg-light rounded-3 border">
                    <small class="fw-bold text-muted d-block mb-2 text-uppercase" style="font-size: 0.7rem;">Quick Demo Logins:</small>
                    <div class="d-flex flex-wrap gap-1">
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="autoFill('customer@autopdi.com', 'Customer@123')">Customer</button>
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="autoFill('inspector@autopdi.com', 'Inspector@123')">Inspector</button>
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="autoFill('admin@autopdi.com', 'Admin@123')">Admin</button>
                    </div>
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label-custom">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" id="email" class="form-control-custom border-start-0" placeholder="name@domain.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label-custom">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" id="password" class="form-control-custom border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-pdi-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-4 text-muted small">
                    Don't have an account? <a href="/register" class="fw-bold text-primary">Register Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
<script>
function autoFill(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
